name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:release
      - run: npm run build:client
      - run: git diff --exit-code -- plugin/dist/client.js
      - run: npm run fixtures
      - run: npm run acceptance:1 && npm run acceptance:2 && npm run acceptance:4
      - name: Package plugin bundle
        run: >-
          tar -czf "dsh-photo-picker-${GITHUB_REF_NAME}.tar.gz"
          -C plugin index.js src dist cordis.patch.yml locale icon.svg package.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" "dsh-photo-picker-${GITHUB_REF_NAME}.tar.gz"
          --title "$GITHUB_REF_NAME" --generate-notes
